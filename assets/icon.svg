<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#121a2b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8fb8ff" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <g clip-path="url(#tile)">
    <!-- log rows: level pill + message line -->
    <g stroke-linecap="round">
      <g transform="translate(0,0)">
        <rect x="190" y="228" width="26" height="54" rx="9" fill="#f44336" stroke="none"/>
        <line x1="248" y1="255" x2="700" y2="255" stroke="#e8eefc" stroke-width="26" opacity="0.92"/>
      </g>
      <g>
        <rect x="190" y="334" width="26" height="54" rx="9" fill="#2196f3"/>
        <line x1="248" y1="361" x2="620" y2="361" stroke="#e8eefc" stroke-width="26" opacity="0.55"/>
      </g>
      <g>
        <rect x="190" y="440" width="26" height="54" rx="9" fill="#ff9800"/>
        <line x1="248" y1="467" x2="745" y2="467" stroke="#e8eefc" stroke-width="26" opacity="0.92"/>
      </g>
      <g>
        <rect x="190" y="546" width="26" height="54" rx="9" fill="#2196f3"/>
        <line x1="248" y1="573" x2="560" y2="573" stroke="#e8eefc" stroke-width="26" opacity="0.55"/>
      </g>
      <g>
        <rect x="190" y="652" width="26" height="54" rx="9" fill="#9e9e9e"/>
        <line x1="248" y1="679" x2="480" y2="679" stroke="#e8eefc" stroke-width="26" opacity="0.40"/>
      </g>
      <g>
        <rect x="190" y="758" width="26" height="54" rx="9" fill="#9e9e9e"/>
        <line x1="248" y1="785" x2="400" y2="785" stroke="#e8eefc" stroke-width="26" opacity="0.30"/>
      </g>
    </g>
  </g>

  <!-- magnifying glass -->
  <g filter="url(#shadow)">
    <line x1="650" y1="650" x2="838" y2="838" stroke="#f5b942" stroke-width="64" stroke-linecap="round"/>
    <circle cx="560" cy="560" r="150" fill="#1a2438"/>
    <circle cx="560" cy="560" r="150" fill="url(#glass)" stroke="#f5b942" stroke-width="44"/>
  </g>
  <!-- highlighted row seen through the lens -->
  <g>
    <clipPath id="lens"><circle cx="560" cy="560" r="128"/></clipPath>
    <g clip-path="url(#lens)" stroke-linecap="round">
      <rect x="452" y="528" width="30" height="64" rx="10" fill="#f44336"/>
      <line x1="512" y1="560" x2="700" y2="560" stroke="#ffe27a" stroke-width="34"/>
    </g>
  </g>
</svg>
